<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Cities Explored — Off Script Diaries</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #121417; color: #F8FAFC; }

        @keyframes osdOrbitSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes osdOrbitReverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes osdCorePulse {
            0%, 100% { transform: scale(0.94); opacity: 0.75; }
            50% { transform: scale(1.06); opacity: 1; }
        }
        @keyframes osdShimmerSlide {
            0% { transform: translateX(-110%); }
            100% { transform: translateX(260%); }
        }
        @keyframes osdFloatUp {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }

        .osd-ring-outer {
            animation: osdOrbitSpin 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .osd-ring-inner {
            animation: osdOrbitReverse 1.9s linear infinite;
        }
        .osd-core-glow {
            animation: osdCorePulse 2.2s ease-in-out infinite;
        }
        .osd-shimmer-bar {
            animation: osdShimmerSlide 1.55s ease-in-out infinite;
        }
        .osd-float {
            animation: osdFloatUp 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="font-sans antialiased pb-12 overflow-hidden">

    <!-- LOADING SCREEN (SHOWN UNTIL FIREBASE LOADS) -->
    <div id="osd-preloader" class="fixed inset-0 z-50 bg-[#121417] flex flex-col items-center justify-center px-6 transition-opacity duration-500">
        <div class="pointer-events-none absolute inset-0 overflow-hidden">
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 rounded-full bg-blue-600/15 blur-3xl osd-core-glow"></div>
        </div>

        <div class="relative z-10 flex flex-col items-center text-center max-w-xs w-full osd-float">
            <div class="relative w-24 h-24 flex items-center justify-center mb-6">
                <div class="absolute inset-0 rounded-full border-2 border-transparent border-t-blue-400 border-r-blue-500/40 osd-ring-outer"></div>
                <div class="absolute inset-2.5 rounded-full border border-dashed border-sky-300/35 osd-ring-inner"></div>
                <div class="w-16 h-16 rounded-full bg-[#1E2126] border border-blue-400/40 shadow-2xl shadow-blue-950/60 overflow-hidden flex items-center justify-center">
                    <img src="OSD.jpg" alt="Off Script Diaries Logo" class="w-full h-full object-cover aspect-square" />
                </div>
            </div>

            <p class="text-[11px] font-bold uppercase tracking-[0.26em] text-blue-400">Off Script Diaries</p>
            <h2 id="preloader-status" class="text-base font-bold text-white mt-1.5">Preparing our little world...</h2>
            <p class="text-xs text-white/50 mt-1">Our story is loading</p>

            <div class="w-48 h-1.5 rounded-full bg-white/10 overflow-hidden mt-6 relative">
                <div class="w-20 h-full rounded-full bg-gradient-to-r from-blue-500 via-sky-300 to-blue-500 osd-shimmer-bar"></div>
            </div>
        </div>
    </div>

    <!-- MAIN SHELL (HIDDEN UNTIL FIREBASE LOADS) -->
    <div id="osd-app-shell" class="opacity-0 pointer-events-none transition-opacity duration-500">

        <!-- TOP HEADER -->
        <header class="sticky top-0 z-40 bg-[#121417]/90 backdrop-blur-md border-b border-white/10">
            <div class="max-w-md mx-auto px-4 h-16 flex items-center justify-between gap-2">
                <div class="flex items-center gap-2.5 min-w-0">
                    <a href="index.html" class="w-9 h-9 rounded-full bg-[#1E2126] border border-white/10 flex items-center justify-center text-xs text-white/80 hover:text-blue-400 shrink-0 transition" title="Back to Home">←</a>
                    <div class="truncate">
                        <h1 class="text-base font-bold text-white truncate leading-tight">Cities Explored 🇮🇳</h1>
                        <p id="header-subtitle" class="text-[11px] text-blue-400 truncate">Off Script Diaries</p>
                    </div>
                </div>
                <div class="px-3 py-1 rounded-full bg-blue-500/15 border border-blue-400/30 text-blue-300 text-xs font-extrabold shrink-0">
                    <span id="cities-count-badge">0</span>
                </div>
            </div>
        </header>

        <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

            <!-- SUMMARY BANNER -->
            <section class="p-4 rounded-2xl bg-[#1E2126] border border-white/10 flex items-center justify-between">
                <div>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-blue-400">India Trail</span>
                    <h2 id="page-heading" class="text-lg font-extrabold text-white mt-0.5">Cities Explored</h2>
                    <p id="page-desc" class="text-xs text-white/60 mt-0.5"></p>
                </div>
                <div class="text-right shrink-0 pl-3">
                    <div id="cities-total-stat" class="text-2xl font-extrabold text-blue-400">0</div>
                    <div class="text-[10px] text-white/50">Cities</div>
                </div>
            </section>

            <!-- CITIES LIST FROM FIREBASE -->
            <section id="cities-list" class="space-y-3"></section>

            <!-- EMPTY STATE -->
            <div id="cities-empty" class="hidden p-6 rounded-2xl bg-[#1E2126] border border-white/10 text-center space-y-1">
                <p class="text-sm font-bold text-white">No cities added yet</p>
                <p class="text-xs text-white/55">Cities added in Firebase will appear here.</p>
            </div>

        </main>

    </div>

    <script src="js/store.js"></script>
    <script>
        let rtdbSiteData = null;
        let hasLoadedFromFirebase = false;

        function revealAppAfterFirebaseLoad() {
            if (hasLoadedFromFirebase) return;
            hasLoadedFromFirebase = true;

            const preloader = document.getElementById('osd-preloader');
            const shell = document.getElementById('osd-app-shell');

            document.body.classList.remove('overflow-hidden');
            if (shell) {
                shell.classList.remove('opacity-0', 'pointer-events-none');
                shell.classList.add('opacity-100');
            }
            if (preloader) {
                preloader.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => preloader.remove(), 520);
            }
        }

        function extractDriveFileId(rawUrl = '') {
            const url = String(rawUrl || '').trim();
            if (!url) return '';
            const patterns = [
                /\/file\/d\/([a-zA-Z0-9_-]+)/,
                /\/d\/([a-zA-Z0-9_-]+)/,
                /[?&]id=([a-zA-Z0-9_-]+)/,
                /\/thumbnail\?id=([a-zA-Z0-9_-]+)/
            ];
            for (const re of patterns) {
                const match = url.match(re);
                if (match && match[1]) return match[1];
            }
            return '';
        }

        function resolveMediaUrl(rawUrl) {
            const cleaned = String(rawUrl || '').trim();
            if (!cleaned) return '';
            let parsed = cleaned;
            if (typeof parseDriveMedia === 'function') {
                const storeResult = parseDriveMedia(cleaned, 'image');
                if (storeResult && typeof storeResult === 'string') {
                    parsed = storeResult.trim();
                }
            }
            const driveId = extractDriveFileId(cleaned) || extractDriveFileId(parsed);
            if (driveId) {
                return `https://drive.google.com/thumbnail?id=${driveId}&sz=w1600`;
            }
            return parsed;
        }

        function normalizeCities(rawCities) {
            if (!rawCities) return [];
            const list = Array.isArray(rawCities)
                ? rawCities
                : (typeof rawCities === 'object' ? Object.values(rawCities) : []);
            return list
                .map((item, idx) => {
                    if (typeof item === 'string') {
                        const name = item.trim();
                        if (!name) return null;
                        return { id: String(idx), name, state: '', date: '', note: '', image: '' };
                    }
                    if (!item || typeof item !== 'object') return null;
                    const name = String(item.name || item.city || item.title || '').trim();
                    const state = String(item.state || item.region || '').trim();
                    const date = String(item.date || item.visitedDate || '').trim();
                    const note = String(item.note || item.desc || item.description || '').trim();
                    const image = String(item.image || item.photoUrl || item.coverUrl || '').trim();
                    if (!name && !state && !note && !image) return null;
                    return { id: String(item.id || idx), name, state, date, note, image };
                })
                .filter(Boolean);
        }

        function renderCitiesPage() {
            if (!hasLoadedFromFirebase) return;

            const src = rtdbSiteData && typeof rtdbSiteData === 'object' ? rtdbSiteData : {};
            const brand = src.brand && typeof src.brand === 'object' ? src.brand : {};
            const sections = src.sections && typeof src.sections === 'object' ? src.sections : {};
            const telemetry = sections.telemetry && typeof sections.telemetry === 'object' ? sections.telemetry : {};
            const explored = sections.explored && typeof sections.explored === 'object' ? sections.explored : {};

            const cities = normalizeCities(
                explored.citiesList ||
                sections.citiesExploredList ||
                sections.citiesList ||
                telemetry.citiesList
            );

            const countValue = cities.length > 0
                ? String(cities.length)
                : String(telemetry.citiesExplored ?? '0');

            document.title = `Cities Explored — ${brand.siteName || 'Off Script Diaries'}`;
            document.getElementById('header-subtitle').textContent = brand.siteName || 'Off Script Diaries';
            document.getElementById('page-heading').textContent = explored.citiesHeading || 'Cities Explored';
            document.getElementById('page-desc').textContent = explored.citiesDescription || '';
            document.getElementById('cities-count-badge').textContent = countValue;
            document.getElementById('cities-total-stat').textContent = countValue;

            const listEl = document.getElementById('cities-list');
            const emptyEl = document.getElementById('cities-empty');

            if (cities.length === 0) {
                listEl.innerHTML = '';
                emptyEl.classList.remove('hidden');
                return;
            }

            emptyEl.classList.add('hidden');
            listEl.innerHTML = cities.map((city, i) => {
                const imgSrc = resolveMediaUrl(city.image);
                const imgHtml = imgSrc
                    ? `<img src="${imgSrc}" alt="${city.name || 'City'}" class="w-full h-40 object-cover rounded-xl bg-[#121417] mb-3" />`
                    : '';
                const metaParts = [city.state, city.date].filter(Boolean).join(' • ');

                return `
                <article class="p-4 rounded-2xl bg-[#1E2126] border border-white/10">
                    ${imgHtml}
                    <div class="flex items-start justify-between gap-2">
                        <div class="min-w-0">
                            <span class="text-[10px] font-bold uppercase tracking-wider text-blue-400">0${i + 1} • City</span>
                            <h3 class="text-base font-bold text-white truncate">${city.name || 'Unnamed City'}</h3>
                            ${metaParts ? `<p class="text-[11px] text-white/50 mt-0.5">${metaParts}</p>` : ''}
                        </div>
                    </div>
                    ${city.note ? `<p class="text-xs text-white/75 mt-2.5 leading-relaxed">${city.note}</p>` : ''}
                </article>`;
            }).join('');
        }
    </script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCnZZ98QZ_Spf-cxUuEjEi0NN1rRpbtOUk",
            authDomain: "offscript-3cf92.firebaseapp.com",
            databaseURL: "https://offscript-3cf92-default-rtdb.firebaseio.com",
            projectId: "offscript-3cf92",
            storageBucket: "offscript-3cf92.firebasestorage.app",
            messagingSenderId: "887672343934",
            appId: "1:887672343934:web:c457cea9a21b696b60f72f",
            measurementId: "G-ZDWB2367X1"
        };

        const app = initializeApp(firebaseConfig);
        const rtdb = getDatabase(app, firebaseConfig.databaseURL);
        const siteDataRef = ref(rtdb, "siteContent");

        onValue(
            siteDataRef,
            (snap) => {
                const val = snap.val();
                rtdbSiteData = val && typeof val === "object" ? val : {};
                revealAppAfterFirebaseLoad();
                renderCitiesPage();
            },
            (err) => {
                const statusEl = document.getElementById("preloader-status");
                if (statusEl) statusEl.textContent = "Unable to load from Firebase";
                console.error("Firebase siteContent read error:", err);
            }
        );
    </script>
</body>
</html>
