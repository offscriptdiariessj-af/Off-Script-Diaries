<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>E-Magazine Studio — Off Script Diaries</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121417] text-white font-sans antialiased pb-28">

    <header class="sticky top-0 z-40 bg-[#121417]/95 backdrop-blur border-b border-white/10">
        <div class="max-w-md mx-auto px-4 h-16 flex items-center justify-between">
            <div>
                <h1 class="text-sm font-bold text-white">Magazine Manager</h1>
                <p class="text-[10px] text-blue-400">New, Edit, Delete • Drive Media</p>
            </div>
            <button onclick="resetForm()" class="px-3 py-1.5 rounded-xl bg-[#1E2126] border border-white/10 text-xs font-semibold text-blue-400">+ New</button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 pt-4 space-y-6">

        <!-- EDITOR FORM -->
        <section class="p-4 rounded-2xl bg-[#1E2126] border border-white/10 space-y-3">
            <div class="flex items-center justify-between">
                <h2 id="editor-mode-title" class="text-sm font-bold text-blue-400">New Post</h2>
                <button id="cancel-edit-btn" onclick="resetForm()" class="hidden text-xs text-white/50">Cancel</button>
            </div>

            <input type="hidden" id="post-id" />
            <input id="post-title" type="text" placeholder="Title *" class="w-full h-11 px-3.5 rounded-xl bg-[#121417] border border-white/10 text-xs" />

            <div class="grid grid-cols-2 gap-2.5">
                <input id="post-date" type="date" class="h-11 px-3 rounded-xl bg-[#121417] border border-white/10 text-xs" />
                <input id="post-category" type="text" placeholder="Category (e.g. TRIP)" class="h-11 px-3 rounded-xl bg-[#121417] border border-white/10 text-xs" />
            </div>

            <select id="post-media-type" onchange="previewPostMedia()" class="w-full h-11 px-3 rounded-xl bg-[#121417] border border-white/10 text-xs">
                <option value="image">Google Drive Photo</option>
                <option value="video">Google Drive Video</option>
            </select>

            <input id="post-media-url" type="text" oninput="previewPostMedia()" placeholder="Paste Google Drive link *" class="w-full h-11 px-3.5 rounded-xl bg-[#121417] border border-white/10 text-xs" />

            <div id="media-preview-box" class="hidden rounded-xl overflow-hidden bg-black border border-white/10 aspect-video"></div>

            <textarea id="post-desc" rows="3" placeholder="Description *" class="w-full p-3.5 rounded-xl bg-[#121417] border border-white/10 text-xs"></textarea>

            <button onclick="savePost()" id="save-post-btn" class="w-full h-11 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold active:scale-[0.99] transition">
                Publish Post
            </button>
        </section>

        <!-- EXISTING POSTS -->
        <section class="space-y-3">
            <h2 class="text-xs font-bold uppercase tracking-wider text-white/60 px-1">All Posts (<span id="post-count">0</span>)</h2>
            <div id="admin-posts-list" class="space-y-3"></div>
        </section>

    </main>

    <nav class="fixed bottom-0 inset-x-0 z-40 bg-[#1E2126]/95 backdrop-blur-md border-t border-white/10">
        <div class="max-w-md mx-auto h-16 grid grid-cols-4 items-center text-center text-[11px] font-medium">
            <a href="index.html" class="text-white/65 flex flex-col items-center gap-0.5"><span>⌂</span><span>Home</span></a>
            <a href="emagazine.html" class="text-white/65 flex flex-col items-center gap-0.5"><span>📖</span><span>Magazine</span></a>
            <a href="emagazineadmin.html" class="text-blue-400 flex flex-col items-center gap-0.5"><span>＋</span><span>Post</span></a>
            <a href="admin.html" class="text-white/65 flex flex-col items-center gap-0.5"><span>⚙</span><span>Admin</span></a>
        </div>
    </nav>

    <script src="js/store.js"></script>
    <script>
        enforcePageLock("Magazine Manager");

        function previewPostMedia() {
            const url = document.getElementById('post-media-url').value.trim();
            const type = document.getElementById('post-media-type').value;
            const box = document.getElementById('media-preview-box');
            if (!url) { box.classList.add('hidden'); box.innerHTML = ''; return; }
            const parsed = parseDriveMedia(url, type);
            box.classList.remove('hidden');
            box.innerHTML = type === 'video'
                ? `<iframe src="${parsed}" class="w-full h-full border-0" allow="autoplay; fullscreen"></iframe>`
                : `<img src="${parsed}" class="w-full h-full object-cover" />`;
        }

        function renderPostsList() {
            const data = getOSDData();
            document.getElementById('post-count').textContent = data.posts.length;
            const list = document.getElementById('admin-posts-list');

            if (!data.posts.length) {
                list.innerHTML = `<div class="p-6 rounded-2xl bg-[#1E2126] text-center text-xs text-white/50">No posts yet.</div>`;
                return;
            }

            list.innerHTML = data.posts.map(post => {
                const parsed = parseDriveMedia(post.mediaUrl, post.mediaType);
                const thumb = post.mediaType === 'video'
                    ? `<div class="w-20 h-16 rounded-xl bg-black flex items-center justify-center text-[10px] font-bold text-blue-400 shrink-0">VIDEO</div>`
                    : `<img src="${parsed}" class="w-20 h-16 rounded-xl object-cover bg-black shrink-0" />`;

                return `
                <div class="p-3.5 rounded-2xl bg-[#1E2126] border border-white/10 flex items-center justify-between gap-3">
                    <div class="flex items-center gap-3 min-w-0">
                        ${thumb}
                        <div class="min-w-0">
                            <span class="text-[10px] text-blue-400 font-bold uppercase">${post.date}</span>
                            <h3 class="text-sm font-bold text-white truncate">${post.title}</h3>
                            <p class="text-xs text-white/60 truncate">${post.description}</p>
                        </div>
                    </div>
                    <div class="flex flex-col gap-1.5 shrink-0">
                        <button onclick="editPost('${post.id}')" class="px-3 py-1 rounded-lg bg-white/10 text-xs font-medium">Edit</button>
                        <button onclick="deletePost('${post.id}')" class="px-3 py-1 rounded-lg bg-rose-500/15 text-rose-400 text-xs font-medium">Delete</button>
                    </div>
                </div>`;
            }).join('');
        }

        function savePost() {
            const id = document.getElementById('post-id').value;
            const title = document.getElementById('post-title').value.trim();
            const date = document.getElementById('post-date').value;
            const category = document.getElementById('post-category').value.trim() || 'DIARY';
            const mediaType = document.getElementById('post-media-type').value;
            const mediaUrl = document.getElementById('post-media-url').value.trim();
            const description = document.getElementById('post-desc').value.trim();

            if (!title || !date || !mediaUrl || !description) {
                alert("Fill Title, Date, Google Drive link, and Description.");
                return;
            }

            const data = getOSDData();
            if (id) {
                const idx = data.posts.findIndex(p => p.id === id);
                if (idx !== -1) data.posts[idx] = { id, title, date, category, mediaType, mediaUrl, description };
            } else {
                data.posts.unshift({ id: 'post_' + Date.now(), title, date, category, mediaType, mediaUrl, description });
            }

            saveOSDData(data);
            resetForm();
            renderPostsList();
        }

        function editPost(id) {
            const post = getOSDData().posts.find(p => p.id === id);
            if (!post) return;
            document.getElementById('post-id').value = post.id;
            document.getElementById('post-title').value = post.title;
            document.getElementById('post-date').value = post.date;
            document.getElementById('post-category').value = post.category || '';
            document.getElementById('post-media-type').value = post.mediaType || 'image';
            document.getElementById('post-media-url').value = post.mediaUrl;
            document.getElementById('post-desc').value = post.description;
            document.getElementById('editor-mode-title').textContent = "Edit Post";
            document.getElementById('save-post-btn').textContent = "Update Post";
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
            previewPostMedia();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deletePost(id) {
            if (!confirm("Delete this post?")) return;
            const data = getOSDData();
            data.posts = data.posts.filter(p => p.id !== id);
            saveOSDData(data);
            if (document.getElementById('post-id').value === id) resetForm();
            renderPostsList();
        }

        function resetForm() {
            document.getElementById('post-id').value = '';
            document.getElementById('post-title').value = '';
            document.getElementById('post-date').value = new Date().toISOString().slice(0, 10);
            document.getElementById('post-category').value = '';
            document.getElementById('post-media-type').value = 'image';
            document.getElementById('post-media-url').value = '';
            document.getElementById('post-desc').value = '';
            document.getElementById('editor-mode-title').textContent = "New Post";
            document.getElementById('save-post-btn').textContent = "Publish Post";
            document.getElementById('cancel-edit-btn').classList.add('hidden');
            previewPostMedia();
        }

        window.addEventListener('DOMContentLoaded', () => { resetForm(); renderPostsList(); });
    </script>
</body>
</html>
