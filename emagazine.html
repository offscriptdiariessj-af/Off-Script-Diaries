<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>E-Magazine — Off Script Diaries</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spotlightRise {
            0% {
                opacity: 0.72;
                transform: translateY(10px) scale(0.97);
            }
            65% {
                opacity: 1;
                transform: translateY(-2px) scale(1.015);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1.01);
            }
        }

        @keyframes miniSlotIn {
            0% {
                opacity: 0.5;
                transform: translateY(6px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .lead-stage {
            position: sticky;
            top: 4rem;
            z-index: 25;
            transform: scale(1.01);
            transform-origin: center top;
            animation: spotlightRise 0.34s cubic-bezier(0.22, 1.2, 0.36, 1) both;
            will-change: transform, opacity;
        }

        .mini-grid-card {
            animation: miniSlotIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .mini-grid-card:active {
            transform: scale(0.94);
        }

        .compact-card {
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .compact-card:active {
            transform: scale(0.98);
        }

        #fullscreen-stage {
            touch-action: pan-y pinch-zoom;
        }
    </style>
</head>
<body class="bg-[#121417] text-white font-sans antialiased pb-24">

    <header class="sticky top-0 z-40 bg-[#121417]/92 backdrop-blur-md border-b border-white/10">
        <div class="max-w-md mx-auto px-3.5 h-14 flex items-center justify-between">
            <a href="index.html#home" class="flex items-center gap-2 min-w-0">
                <img id="mag-logo" src="" alt="Brand Logo" class="w-8 h-8 rounded-full object-cover aspect-square border border-blue-400/50 shrink-0" />
                <span id="mag-brand" class="text-sm font-bold truncate">Off Script Diaries</span>
            </a>
            <button type="button" onclick="lockRoleSession('magazine')" class="text-[10px] font-bold uppercase tracking-wider text-blue-400 px-2.5 py-1 rounded-full bg-blue-500/15 border border-blue-400/30 active:scale-95">
                Lock
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-3.5 pt-3 space-y-3">
        <input id="search-posts" type="search" placeholder="Search title, date, category..." class="w-full h-10 px-3.5 rounded-xl bg-[#1E2126] border border-white/10 text-xs text-white focus:outline-none focus:border-blue-500" />
        <div id="magazine-feed" class="space-y-3"></div>
    </main>

    <!-- FULL-SCREEN SWIPEABLE PICTURE VIEWER -->
    <div id="fullscreen-viewer" class="hidden fixed inset-0 z-50 bg-black/98 backdrop-blur-md flex flex-col justify-between select-none">
        <div class="px-4 pt-4 pb-2 flex items-center justify-between text-xs text-white/75">
            <span id="fs-counter" class="font-mono font-semibold text-blue-400">1 / 1</span>
            <span class="text-[11px] text-white/50">Swipe left / right</span>
            <button id="fs-close-btn" type="button" class="px-2.5 py-1 rounded-lg bg-white/10 text-white text-xs font-semibold">✕</button>
        </div>

        <div id="fullscreen-stage" class="relative flex-1 flex items-center justify-center px-3 overflow-hidden">
            <img id="fs-image" src="" alt="" class="max-h-[76vh] w-full object-contain rounded-2xl transition-transform duration-200 ease-out" />
            <iframe id="fs-video" src="" class="hidden w-full aspect-video rounded-2xl border-0 bg-black" allow="autoplay; fullscreen" allowfullscreen></iframe>

            <button id="fs-prev-btn" type="button" aria-label="Previous picture" class="hidden sm:flex absolute left-3 w-10 h-10 rounded-full bg-black/60 border border-white/15 items-center justify-center text-white hover:border-blue-400">‹</button>
            <button id="fs-next-btn" type="button" aria-label="Next picture" class="hidden sm:flex absolute right-3 w-10 h-10 rounded-full bg-black/60 border border-white/15 items-center justify-center text-white hover:border-blue-400">›</button>
        </div>

        <div class="px-4 pb-5 pt-2 bg-gradient-to-t from-black via-black/80 to-transparent">
            <div class="flex items-center justify-between text-[10px] font-bold uppercase text-blue-400">
                <span id="fs-category"></span>
                <span id="fs-date" class="text-white/55 font-normal"></span>
            </div>
            <h3 id="fs-title" class="text-base font-extrabold text-white mt-0.5 truncate"></h3>
            <p id="fs-caption" class="text-xs text-white/75 mt-1 line-clamp-2 leading-relaxed"></p>
        </div>
    </div>

    <nav class="fixed bottom-0 inset-x-0 z-40 bg-[#1E2126]/95 backdrop-blur-md border-t border-white/10">
        <div class="max-w-md mx-auto h-14 grid grid-cols-4 items-center text-center text-[10px] font-medium">
            <a href="index.html#home" class="text-white/65 hover:text-white flex flex-col items-center gap-0.5"><span class="text-xs">⌂</span><span>Home</span></a>
            <button id="nav-mag-refresh" type="button" class="text-blue-400 flex flex-col items-center gap-0.5 font-semibold"><span class="text-xs">📖</span><span>Magazine</span></button>
            <a href="index.html#stats" class="text-white/65 hover:text-white flex flex-col items-center gap-0.5"><span class="text-xs">◈</span><span>Stats</span></a>
            <a href="index.html#vault" class="text-white/65 hover:text-white flex flex-col items-center gap-0.5"><span class="text-xs">✦</span><span>Vault</span></a>
        </div>
    </nav>

    <script src="js/store.js"></script>
    <script>
        const MAG_ACTIVE_POST_KEY = 'osd_mag_active_post_v1';
        const MAG_SCROLL_KEY = 'osd_mag_scroll_v1';

        const searchInput = document.getElementById('search-posts');
        const feedEl = document.getElementById('magazine-feed');
        const logoEl = document.getElementById('mag-logo');
        const brandEl = document.getElementById('mag-brand');

        const fsViewer = document.getElementById('fullscreen-viewer');
        const fsStage = document.getElementById('fullscreen-stage');
        const fsImg = document.getElementById('fs-image');
        const fsVideo = document.getElementById('fs-video');
        const fsCounter = document.getElementById('fs-counter');
        const fsCategory = document.getElementById('fs-category');
        const fsDate = document.getElementById('fs-date');
        const fsTitle = document.getElementById('fs-title');
        const fsCaption = document.getElementById('fs-caption');

        let activePostId = sessionStorage.getItem(MAG_ACTIVE_POST_KEY) || null;
        let fullscreenPostId = null;
        let scrollSaveTimer = null;

        function escapeHtml(str = '') {
            return String(str).replace(/[&<>"']/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));
        }

        function syncStageStorage() {
            if (activePostId) {
                sessionStorage.setItem(MAG_ACTIVE_POST_KEY, activePostId);
            } else {
                sessionStorage.removeItem(MAG_ACTIVE_POST_KEY);
            }
        }

        function getFilteredPosts(q = '') {
            const data = getOSDData();
            const term = (q || '').trim().toLowerCase();
            if (!term) return data.posts;
            return data.posts.filter(p =>
                (p.title || '').toLowerCase().includes(term) ||
                (p.description || '').toLowerCase().includes(term) ||
                (p.category || '').toLowerCase().includes(term) ||
                (p.date || '').toLowerCase().includes(term)
            );
        }

        // 1st tap on post -> opens in scaled version; tapping active scaled post again -> toggles off
        function selectPost(postId) {
            activePostId = activePostId === postId ? null : postId;
            fullscreenPostId = null;
            syncStageStorage();
            syncFullscreenUI();
            renderMagazine(searchInput.value);
            if (activePostId) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // Tap image inside scaled version -> opens full-screen viewer & adds a single full-screen entry
        function openScaledImageFullscreen(event, postId) {
            event.stopPropagation();
            if (activePostId !== postId) {
                selectPost(postId);
                return;
            }
            activePostId = postId;
            fullscreenPostId = postId;
            syncStageStorage();
            try {
                history.pushState({ osdFullscreenEntry: true, osdPostId: postId }, '', window.location.href);
            } catch {}
            syncFullscreenUI();
        }

        // Exit full-screen to the scaled version of whichever image is currently viewing
        function exitFullscreenToScaled() {
            const targetScaledId = fullscreenPostId || activePostId;
            fullscreenPostId = null;
            activePostId = targetScaledId;
            syncStageStorage();
            syncFullscreenUI();
            renderMagazine(searchInput.value);
            if (activePostId) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // Swiping in full-screen updates only the currently viewed picture without adding swipe history entries
        function stepFullscreenPicture(delta) {
            const posts = getFilteredPosts(searchInput.value);
            if (!posts.length) return;
            const currentId = fullscreenPostId || activePostId;
            const currentIdx = Math.max(0, posts.findIndex(p => p.id === currentId));
            const nextIdx = (currentIdx + delta + posts.length) % posts.length;
            const nextPost = posts[nextIdx];
            if (!nextPost) return;

            fullscreenPostId = nextPost.id;
            activePostId = nextPost.id;
            syncStageStorage();
            syncFullscreenUI();
        }

        function syncFullscreenUI() {
            const posts = getFilteredPosts(searchInput.value);
            if (!fullscreenPostId || !posts.length) {
                fsViewer.classList.add('hidden');
                fsVideo.src = '';
                document.documentElement.style.overflow = '';
                return;
            }

            const idx = posts.findIndex(p => p.id === fullscreenPostId);
            const post = idx >= 0 ? posts[idx] : posts[0];
            const safeIdx = idx >= 0 ? idx : 0;
            const media = parseDriveMedia(post.mediaUrl, post.mediaType);

            fsViewer.classList.remove('hidden');
            document.documentElement.style.overflow = 'hidden';

            fsCounter.textContent = `${safeIdx + 1} / ${posts.length}`;
            fsCategory.textContent = post.category || 'JOURNAL';
            fsDate.textContent = post.date || '';
            fsTitle.textContent = post.title || '';
            fsCaption.textContent = post.description || '';

            if (post.mediaType === 'video') {
                fsImg.classList.add('hidden');
                fsVideo.classList.remove('hidden');
                fsVideo.src = media;
            } else {
                fsVideo.classList.add('hidden');
                fsVideo.src = '';
                fsImg.classList.remove('hidden');
                fsImg.src = media;
                fsImg.alt = post.title || '';
            }
        }

        // Native Back button while in full-screen goes straight to scaled version of currently viewed image
        window.addEventListener('popstate', () => {
            if (fullscreenPostId) {
                exitFullscreenToScaled();
            }
        });

        let touchStartX = 0;
        let touchDeltaX = 0;

        fsStage.addEventListener('touchstart', (e) => {
            if (!e.touches || !e.touches.length) return;
            touchStartX = e.touches[0].clientX;
            touchDeltaX = 0;
            fsImg.style.transition = 'none';
        }, { passive: true });

        fsStage.addEventListener('touchmove', (e) => {
            if (!e.touches || !e.touches.length) return;
            touchDeltaX = e.touches[0].clientX - touchStartX;
            if (Math.abs(touchDeltaX) > 6 && !fsImg.classList.contains('hidden')) {
                fsImg.style.transform = `translateX(${touchDeltaX * 0.45}px) rotate(${touchDeltaX * 0.015}deg)`;
            }
        }, { passive: true });

        fsStage.addEventListener('touchend', () => {
            fsImg.style.transition = 'transform 0.22s ease-out';
            fsImg.style.transform = 'translateX(0px) rotate(0deg)';
            if (Math.abs(touchDeltaX) > 55) {
                stepFullscreenPicture(touchDeltaX < 0 ? 1 : -1);
            }
            touchStartX = 0;
            touchDeltaX = 0;
        });

        document.getElementById('fs-close-btn').addEventListener('click', exitFullscreenToScaled);
        document.getElementById('fs-prev-btn').addEventListener('click', () => stepFullscreenPicture(-1));
        document.getElementById('fs-next-btn').addEventListener('click', () => stepFullscreenPicture(1));

        function renderMediaBox(post, media, heightClass, isScaledPost) {
            const safeTitle = escapeHtml(post.title);
            const safeMedia = escapeHtml(media);
            const safeId = escapeHtml(post.id);

            const content = post.mediaType === 'video'
                ? `<iframe src="${safeMedia}" class="w-full h-full border-0" loading="lazy" allow="autoplay; fullscreen" allowfullscreen></iframe>`
                : `<img src="${safeMedia}" alt="${safeTitle}" loading="lazy" class="w-full h-full object-cover" />`;

            const tapAttr = isScaledPost
                ? `onclick="openScaledImageFullscreen(event, '${safeId}')"`
                : '';

            return `
                <div ${tapAttr} class="${heightClass} w-full bg-black overflow-hidden relative ${isScaledPost ? 'cursor-zoom-in' : ''}">
                    ${content}
                </div>`;
        }

        function buildFeaturedCard(post, media) {
            const title = escapeHtml(post.title);
            const category = escapeHtml(post.category || 'JOURNAL');
            const date = escapeHtml(post.date || '');
            const desc = escapeHtml(post.description || '');
            const mediaType = escapeHtml(post.mediaType || 'image');

            return `
                <article
                    onclick="selectPost('${escapeHtml(post.id)}')"
                    class="lead-stage cursor-pointer rounded-2xl bg-[#1E2126]/95 backdrop-blur-xl border border-blue-400/50 shadow-2xl shadow-black/75 overflow-hidden"
                >
                    ${renderMediaBox(post, media, 'h-48', true)}
                    <div class="p-3.5">
                        <div class="flex items-center justify-between text-[10px] font-bold uppercase text-blue-400">
                            <span>${category}</span>
                            <span class="text-white/50 font-normal">${date}</span>
                        </div>
                        <h2 class="text-lg font-extrabold text-white leading-snug mt-0.5">${title}</h2>
                        <p class="text-xs mt-1.5 text-white/90 leading-relaxed whitespace-pre-line">${desc}</p>
                        <div class="mt-2.5 pt-2 border-t border-white/10 text-[10px] text-white/50 uppercase">
                            ${mediaType}
                        </div>
                    </div>
                </article>`;
        }

        function buildThreeColCard(post, media) {
            const title = escapeHtml(post.title);
            const category = escapeHtml(post.category || 'DIARY');
            const date = escapeHtml(post.date || '');
            const desc = escapeHtml(post.description || '');
            const safeId = escapeHtml(post.id);

            const thumb = post.mediaType === 'video'
                ? `<div class="h-16 w-full bg-black flex items-center justify-center text-[10px] font-bold text-blue-400">▶ VIDEO</div>`
                : `<div class="h-16 w-full bg-black overflow-hidden"><img src="${escapeHtml(media)}" alt="${title}" loading="lazy" class="w-full h-full object-cover" /></div>`;

            return `
                <article
                    onclick="selectPost('${safeId}')"
                    class="mini-grid-card cursor-pointer rounded-xl bg-[#1E2126]/90 border border-white/10 hover:border-blue-400/40 overflow-hidden flex flex-col"
                >
                    ${thumb}
                    <div class="p-2 flex-1 flex flex-col justify-between">
                        <div>
                            <div class="text-[9px] font-bold uppercase text-blue-400 truncate">${category}</div>
                            <h3 class="text-[11px] font-bold text-white leading-tight line-clamp-1 mt-0.5">${title}</h3>
                            <p class="text-[10px] text-white/60 line-clamp-2 mt-0.5 leading-snug">${desc}</p>
                        </div>
                        <div class="text-[9px] text-white/40 mt-1 truncate">${date}</div>
                    </div>
                </article>`;
        }

        function buildNormalCard(post, media) {
            const title = escapeHtml(post.title);
            const category = escapeHtml(post.category || 'JOURNAL');
            const date = escapeHtml(post.date || '');
            const desc = escapeHtml(post.description || '');

            return `
                <article
                    onclick="selectPost('${escapeHtml(post.id)}')"
                    class="compact-card cursor-pointer rounded-2xl bg-[#1E2126] border border-white/10 hover:border-blue-400/35 overflow-hidden"
                >
                    ${renderMediaBox(post, media, 'h-36', false)}
                    <div class="p-3">
                        <div class="flex items-center justify-between text-[10px] font-bold uppercase text-blue-400">
                            <span>${category}</span>
                            <span class="text-white/45 font-normal">${date}</span>
                        </div>
                        <h3 class="text-sm font-bold text-white leading-snug mt-0.5">${title}</h3>
                        <p class="text-xs mt-1 line-clamp-2 text-white/75 leading-relaxed">${desc}</p>
                    </div>
                </article>`;
        }

        function renderMagazine(q = '') {
            const data = getOSDData();
            logoEl.src = parseDriveMedia(data.brand.logoUrl, 'image');
            brandEl.textContent = data.brand.siteName;

            const posts = getFilteredPosts(q);

            if (!posts.length) {
                feedEl.innerHTML = `<div class="p-6 rounded-2xl bg-[#1E2126] text-center text-xs text-white/50">No matching posts found.</div>`;
                return;
            }

            const featuredPost = activePostId ? posts.find(p => p.id === activePostId) : null;

            if (featuredPost) {
                const others = posts.filter(p => p.id !== featuredPost.id);
                const topThree = others.slice(0, 3);
                const remaining = others.slice(3);

                const topThreeHtml = topThree.length
                    ? `<div class="grid grid-cols-3 gap-2 pt-1">${topThree.map(p => buildThreeColCard(p, parseDriveMedia(p.mediaUrl, p.mediaType))).join('')}</div>`
                    : '';

                const remainingHtml = remaining.length
                    ? `<div class="space-y-2.5 pt-1">${remaining.map(p => buildNormalCard(p, parseDriveMedia(p.mediaUrl, p.mediaType))).join('')}</div>`
                    : '';

                feedEl.innerHTML = `
                    ${buildFeaturedCard(featuredPost, parseDriveMedia(featuredPost.mediaUrl, featuredPost.mediaType))}
                    ${topThreeHtml}
                    ${remainingHtml}
                `;
                return;
            }

            feedEl.innerHTML = posts.map(post => buildNormalCard(post, parseDriveMedia(post.mediaUrl, post.mediaType))).join('');
        }

        window.addEventListener('scroll', () => {
            clearTimeout(scrollSaveTimer);
            scrollSaveTimer = setTimeout(() => {
                sessionStorage.setItem(MAG_SCROLL_KEY, String(window.scrollY));
            }, 80);
        }, { passive: true });

        searchInput.addEventListener('input', e => renderMagazine(e.target.value));
        document.getElementById('nav-mag-refresh').addEventListener('click', () => {
            renderMagazine(searchInput.value);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        window.addEventListener('DOMContentLoaded', () => {
            try {
                history.replaceState({ osdFullscreenEntry: false, osdPostId: activePostId }, '', window.location.href);
            } catch {}
            renderMagazine();
            const savedScroll = Number(sessionStorage.getItem(MAG_SCROLL_KEY) || '0');
            if (savedScroll > 0) {
                requestAnimationFrame(() => window.scrollTo(0, savedScroll));
            }
            enforceRoleLock('magazine', 'E-Magazine');
        });

        window.addEventListener('storage', () => renderMagazine(searchInput.value));
        window.addEventListener('osd_data_updated', () => renderMagazine(searchInput.value));
    </script>
</body>
</html>
