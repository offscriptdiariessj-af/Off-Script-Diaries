<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>E-Magazine — Off Script Diaries</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spotlightSpring {
            0% {
                opacity: 0.72;
                transform: translateY(14px) scale(0.95);
            }
            65% {
                opacity: 1;
                transform: translateY(-2px) scale(1.018);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes dockSettle {
            0% {
                opacity: 0.6;
                transform: scale(0.98);
            }
            100% {
                opacity: 0.92;
                transform: scale(0.955);
            }
        }

        .spotlight-pin {
            position: sticky;
            top: 4.5rem;
            z-index: 25;
            transform-origin: center top;
            animation: spotlightSpring 0.42s cubic-bezier(0.22, 1.25, 0.36, 1) both;
            will-change: transform, opacity;
        }

        .docked-card {
            transform-origin: center top;
            animation: dockSettle 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
            transition: transform 0.24s ease, border-color 0.24s ease, background-color 0.24s ease;
        }

        .docked-card:active {
            transform: scale(0.92);
        }

        .standard-card {
            transform-origin: center top;
            transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.24s ease, box-shadow 0.24s ease;
        }

        .standard-card:active {
            transform: scale(0.975);
        }

        .spotlight-glow {
            box-shadow:
                0 24px 55px -12px rgba(0, 0, 0, 0.85),
                0 0 0 1px rgba(96, 165, 250, 0.35),
                0 0 36px -8px rgba(59, 130, 246, 0.38);
        }
    </style>
</head>
<body class="bg-[#121417] text-white font-sans antialiased pb-28">

    <header class="sticky top-0 z-40 bg-[#121417]/90 backdrop-blur-md border-b border-white/10">
        <div class="max-w-md mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html#home" class="flex items-center gap-2.5 min-w-0">
                <img id="mag-logo" src="" alt="Brand Logo" class="w-9 h-9 rounded-full object-cover aspect-square border border-blue-400/50 shrink-0" />
                <span id="mag-brand" class="text-sm font-bold truncate">Off Script Diaries</span>
            </a>
            <button type="button" onclick="lockRoleSession('magazine')" class="text-[10px] font-bold uppercase tracking-wider text-blue-400 px-3 py-1.5 rounded-full bg-blue-500/15 border border-blue-400/30 active:scale-95">
                Lock
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 pt-4 space-y-4">
        <input id="search-posts" type="search" placeholder="Search title, date, category..." class="w-full h-11 px-4 rounded-xl bg-[#1E2126] border border-white/10 text-sm text-white focus:outline-none focus:border-blue-500" />
        <div id="magazine-feed" class="space-y-4"></div>
    </main>

    <nav class="fixed bottom-0 inset-x-0 z-40 bg-[#1E2126]/95 backdrop-blur-md border-t border-white/10">
        <div class="max-w-md mx-auto h-16 grid grid-cols-4 items-center text-center text-[11px] font-medium">
            <a href="index.html#home" class="text-white/65 hover:text-white flex flex-col items-center gap-0.5"><span>⌂</span><span>Home</span></a>
            <button id="nav-mag-refresh" type="button" class="text-blue-400 flex flex-col items-center gap-0.5 font-semibold"><span>📖</span><span>Magazine</span></button>
            <a href="index.html#stats" class="text-white/65 hover:text-white flex flex-col items-center gap-0.5"><span>◈</span><span>Stats</span></a>
            <a href="index.html#vault" class="text-white/65 hover:text-white flex flex-col items-center gap-0.5"><span>✦</span><span>Vault</span></a>
        </div>
    </nav>

    <script src="js/store.js"></script>
    <script>
        const MAG_ACTIVE_POST_KEY = 'osd_mag_active_post_v1';
        const MAG_SCROLL_KEY = 'osd_mag_scroll_v1';

        const searchInput = document.getElementById('search-posts');
        const feedEl = document.getElementById('magazine-feed');
        const logoEl = document.getElementById('mag-logo');
        const brandEl = document.getElementById('mag-brand');

        let activePostId = sessionStorage.getItem(MAG_ACTIVE_POST_KEY) || null;
        let stageStack = activePostId ? [activePostId] : [null];
        let isPopstateStep = false;
        let scrollSaveTimer = null;

        function escapeHtml(str = '') {
            return String(str).replace(/[&<>"']/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));
        }

        function syncStageStorage() {
            if (activePostId) {
                sessionStorage.setItem(MAG_ACTIVE_POST_KEY, activePostId);
            } else {
                sessionStorage.removeItem(MAG_ACTIVE_POST_KEY);
            }
        }

        // Tapping a card always advances the stage forward (tapping pinned card also pushes a new stage step, never history.back)
        function pinPostStage(postId) {
            const nextId = activePostId === postId ? null : postId;
            if (!isPopstateStep) {
                stageStack.push(nextId);
                try {
                    history.pushState({ osdMagStage: nextId, step: stageStack.length }, '', window.location.href);
                } catch {}
            }
            activePostId = nextId;
            syncStageStorage();
            renderMagazine(searchInput.value);
            if (activePostId) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        window.addEventListener('popstate', (e) => {
            isPopstateStep = true;
            if (stageStack.length > 1) {
                stageStack.pop();
                activePostId = stageStack[stageStack.length - 1] ?? null;
            } else {
                activePostId = e.state && Object.prototype.hasOwnProperty.call(e.state, 'osdMagStage')
                    ? e.state.osdMagStage
                    : null;
            }
            syncStageStorage();
            renderMagazine(searchInput.value);
            isPopstateStep = false;
        });

        function buildDockedCard(post, media) {
            const title = escapeHtml(post.title);
            const category = escapeHtml(post.category || 'DIARY');
            const date = escapeHtml(post.date || '');
            const desc = escapeHtml(post.description || '');
            const safeMedia = escapeHtml(media);

            const thumb = post.mediaType === 'video'
                ? `<span class="text-[10px] font-bold text-blue-400">▶ VID</span>`
                : `<img src="${safeMedia}" alt="${title}" loading="lazy" class="w-full h-full object-cover" />`;

            return `
                <article
                    onclick="pinPostStage('${escapeHtml(post.id)}')"
                    class="docked-card cursor-pointer rounded-2xl bg-[#1E2126]/90 border border-white/10 p-2.5 flex items-center gap-3 scale-[0.955]"
                >
                    <div class="w-12 h-12 rounded-xl overflow-hidden bg-black shrink-0 flex items-center justify-center border border-white/10">
                        ${thumb}
                    </div>
                    <div class="min-w-0 flex-1">
                        <div class="flex items-center justify-between text-[10px] text-white/45">
                            <span class="text-blue-400 font-bold uppercase tracking-wide">${category}</span>
                            <span>${date}</span>
                        </div>
                        <h3 class="text-xs font-bold text-white/95 truncate mt-0.5">${title}</h3>
                        <p class="text-[11px] text-white/55 line-clamp-1">${desc}</p>
                    </div>
                    <span class="text-[10px] font-bold text-blue-400/80 px-2 py-1 rounded-lg bg-blue-500/10 shrink-0">Pin</span>
                </article>`;
        }

        function buildCard(post, isPinned, media) {
            const title = escapeHtml(post.title);
            const category = escapeHtml(post.category || 'JOURNAL');
            const date = escapeHtml(post.date || '');
            const desc = escapeHtml(post.description || '');
            const mediaType = escapeHtml(post.mediaType || 'image');
            const safeMedia = escapeHtml(media);

            const mediaBlock = post.mediaType === 'video'
                ? `<div class="${isPinned ? 'aspect-video' : 'aspect-[4/3]'} w-full bg-black"><iframe src="${safeMedia}" class="w-full h-full border-0" loading="lazy" allow="autoplay; fullscreen" allowfullscreen></iframe></div>`
                : `<div class="${isPinned ? 'aspect-square' : 'aspect-[4/3]'} w-full bg-black"><img src="${safeMedia}" alt="${title}" loading="lazy" class="w-full h-full object-cover" /></div>`;

            const bodyBlock = isPinned
                ? `
                    <div class="mt-3 pt-3 border-t border-white/10 flex flex-wrap items-center justify-between gap-2 text-[11px] text-white/65">
                        <span class="px-2 py-0.5 rounded-md bg-blue-500/15 text-blue-300 font-semibold">${category}</span>
                        <span>${date}</span>
                        <span class="uppercase text-white/50">${mediaType}</span>
                    </div>
                    <p class="text-sm mt-3 text-white/95 leading-relaxed whitespace-pre-line">${desc}</p>
                    <div class="mt-3.5 flex items-center justify-between text-[10px] font-bold uppercase tracking-wider text-blue-400">
                        <span class="inline-flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></span>
                            Pinned Spotlight
                        </span>
                        <span>Tap to unpin</span>
                    </div>`
                : `
                    <p class="text-xs mt-2 line-clamp-2 text-white/75 leading-relaxed">${desc}</p>
                    <div class="mt-3 text-[10px] font-semibold uppercase tracking-wider text-blue-400">
                        Tap to pin &amp; expand
                    </div>`;

            return `
                <article
                    onclick="pinPostStage('${escapeHtml(post.id)}')"
                    class="${isPinned ? 'spotlight-pin spotlight-glow rounded-3xl bg-[#1E2126]/95 backdrop-blur-xl border-2 border-blue-400/70 p-1.5' : 'standard-card cursor-pointer rounded-3xl bg-[#1E2126] border border-white/10'}"
                >
                    <div class="rounded-2xl overflow-hidden bg-[#1E2126]">
                        ${mediaBlock}
                        <div class="${isPinned ? 'p-5' : 'p-4'}">
                            <div class="flex items-center justify-between text-[11px] font-bold uppercase text-blue-400">
                                <span>${category}</span>
                                <span class="text-white/50 font-normal">${date}</span>
                            </div>
                            <h2 class="${isPinned ? 'text-2xl mt-1.5' : 'text-lg mt-1'} font-extrabold text-white leading-snug">${title}</h2>
                            ${bodyBlock}
                        </div>
                    </div>
                </article>`;
        }

        function renderMagazine(q = '') {
            const data = getOSDData();
            logoEl.src = parseDriveMedia(data.brand.logoUrl, 'image');
            brandEl.textContent = data.brand.siteName;

            const term = (q || '').trim().toLowerCase();
            const posts = term
                ? data.posts.filter(p =>
                    (p.title || '').toLowerCase().includes(term) ||
                    (p.description || '').toLowerCase().includes(term) ||
                    (p.category || '').toLowerCase().includes(term) ||
                    (p.date || '').toLowerCase().includes(term)
                )
                : data.posts;

            if (!posts.length) {
                feedEl.innerHTML = `<div class="p-8 rounded-2xl bg-[#1E2126] text-center text-xs text-white/50">No matching posts found.</div>`;
                return;
            }

            const hasPinned = activePostId !== null && posts.some(p => p.id === activePostId);
            const ordered = hasPinned
                ? [...posts.filter(p => p.id === activePostId), ...posts.filter(p => p.id !== activePostId)]
                : posts;

            feedEl.innerHTML = ordered.map(post => {
                const media = parseDriveMedia(post.mediaUrl, post.mediaType);
                if (hasPinned && post.id === activePostId) {
                    return buildCard(post, true, media);
                }
                if (hasPinned) {
                    return buildDockedCard(post, media);
                }
                return buildCard(post, false, media);
            }).join('');
        }

        window.addEventListener('scroll', () => {
            clearTimeout(scrollSaveTimer);
            scrollSaveTimer = setTimeout(() => {
                sessionStorage.setItem(MAG_SCROLL_KEY, String(window.scrollY));
            }, 80);
        }, { passive: true });

        searchInput.addEventListener('input', e => renderMagazine(e.target.value));
        document.getElementById('nav-mag-refresh').addEventListener('click', () => {
            renderMagazine(searchInput.value);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        window.addEventListener('DOMContentLoaded', () => {
            try {
                history.replaceState({ osdMagStage: activePostId, step: stageStack.length }, '', window.location.href);
            } catch {}
            renderMagazine();
            const savedScroll = Number(sessionStorage.getItem(MAG_SCROLL_KEY) || '0');
            if (savedScroll > 0) {
                requestAnimationFrame(() => window.scrollTo(0, savedScroll));
            }
            enforceRoleLock('magazine', 'E-Magazine');
        });

        window.addEventListener('storage', () => renderMagazine(searchInput.value));
        window.addEventListener('osd_data_updated', () => renderMagazine(searchInput.value));
    </script>
</body>
</html>
