<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>E-Magazine — Off Script Diaries</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes folderRise {
            0% {
                opacity: 0.72;
                transform: translateY(10px) scale(0.97);
            }
            65% {
                opacity: 1;
                transform: translateY(-2px) scale(1.015);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1.01);
            }
        }

        @keyframes miniSlotIn {
            0% {
                opacity: 0.5;
                transform: translateY(6px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .lead-stage {
            position: sticky;
            top: 4rem;
            z-index: 25;
            transform: scale(1.01);
            transform-origin: center top;
            animation: folderRise 0.34s cubic-bezier(0.22, 1.2, 0.36, 1) both;
            will-change: transform, opacity;
        }

        .mini-grid-card {
            animation: miniSlotIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .mini-grid-card:active {
            transform: scale(0.94);
        }

        .compact-card {
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .compact-card:active {
            transform: scale(0.98);
        }

        #fullscreen-stage {
            touch-action: pan-y pinch-zoom;
        }
    </style>
</head>
<body class="bg-[#121417] text-white font-sans antialiased pb-24">

    <header class="sticky top-0 z-40 bg-[#121417]/92 backdrop-blur-md border-b border-white/10">
        <div class="max-w-md mx-auto px-3.5 h-14 flex items-center justify-between">
            <a href="index.html#home" class="flex items-center gap-2 min-w-0">
                <img id="mag-logo" src="" alt="Brand Logo" class="w-8 h-8 rounded-full object-cover aspect-square border border-blue-400/50 shrink-0" />
                <span id="mag-brand" class="text-sm font-bold truncate">Off Script Diaries</span>
            </a>
            <button type="button" onclick="lockRoleSession('magazine')" class="text-[10px] font-bold uppercase tracking-wider text-blue-400 px-2.5 py-1 rounded-full bg-blue-500/15 border border-blue-400/30 active:scale-95">
                Lock
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-3.5 pt-3 space-y-3">
        <input id="search-posts" type="search" placeholder="Search title, date, category..." class="w-full h-10 px-3.5 rounded-xl bg-[#1E2126] border border-white/10 text-xs text-white focus:outline-none focus:border-blue-500" />
        <div id="magazine-feed" class="space-y-3"></div>
    </main>

    <!-- FULL-SCREEN SWIPEABLE VIEWER FOR ACTIVE DATE FOLDER -->
    <div id="fullscreen-viewer" class="hidden fixed inset-0 z-50 bg-black/98 backdrop-blur-md flex flex-col justify-between select-none">
        <div class="px-4 pt-4 pb-2 flex items-center justify-between text-xs text-white/75">
            <span id="fs-counter" class="font-mono font-semibold text-blue-400">1 / 1</span>
            <span class="text-[11px] text-white/50">Swipe left / right</span>
            <button id="fs-close-btn" type="button" class="px-2.5 py-1 rounded-lg bg-white/10 text-white text-xs font-semibold">✕</button>
        </div>

        <div id="fullscreen-stage" class="relative flex-1 flex items-center justify-center px-3 overflow-hidden">
            <img id="fs-image" src="" alt="" class="max-h-[76vh] w-full object-contain rounded-2xl transition-transform duration-200 ease-out" />
            <iframe id="fs-video" src="" class="hidden w-full aspect-video rounded-2xl border-0 bg-black" allow="autoplay; fullscreen" allowfullscreen></iframe>

            <button id="fs-prev-btn" type="button" aria-label="Previous item" class="hidden sm:flex absolute left-3 w-10 h-10 rounded-full bg-black/60 border border-white/15 items-center justify-center text-white hover:border-blue-400">‹</button>
            <button id="fs-next-btn" type="button" aria-label="Next item" class="hidden sm:flex absolute right-3 w-10 h-10 rounded-full bg-black/60 border border-white/15 items-center justify-center text-white hover:border-blue-400">›</button>
        </div>

        <div class="px-4 pb-5 pt-2 bg-gradient-to-t from-black via-black/80 to-transparent">
            <div class="flex items-center justify-between text-[10px] font-bold uppercase text-blue-400">
                <span id="fs-category"></span>
                <span id="fs-date" class="text-white/55 font-normal"></span>
            </div>
            <h3 id="fs-title" class="text-base font-extrabold text-white mt-0.5 truncate"></h3>
            <p id="fs-caption" class="text-xs text-white/75 mt-1 line-clamp-2 leading-relaxed"></p>
        </div>
    </div>

    <nav class="fixed bottom-0 inset-x-0 z-40 bg-[#1E2126]/95 backdrop-blur-md border-t border-white/10">
        <div class="max-w-md mx-auto h-14 grid grid-cols-4 items-center text-center text-[10px] font-medium">
            <a href="index.html#home" class="text-white/65 hover:text-white flex flex-col items-center gap-0.5"><span class="text-xs">⌂</span><span>Home</span></a>
            <button id="nav-mag-refresh" type="button" class="text-blue-400 flex flex-col items-center gap-0.5 font-semibold"><span class="text-xs">📖</span><span>Magazine</span></button>
            <a href="index.html#stats" class="text-white/65 hover:text-white flex flex-col items-center gap-0.5"><span class="text-xs">◈</span><span>Stats</span></a>
            <a href="index.html#vault" class="text-white/65 hover:text-white flex flex-col items-center gap-0.5"><span class="text-xs">✦</span><span>Vault</span></a>
        </div>
    </nav>

    <script src="js/store.js"></script>
    <script>
        const MAG_ACTIVE_FOLDER_KEY = 'osd_mag_active_folder_v1';
        const MAG_SCROLL_KEY = 'osd_mag_scroll_v1';

        const searchInput = document.getElementById('search-posts');
        const feedEl = document.getElementById('magazine-feed');
        const logoEl = document.getElementById('mag-logo');
        const brandEl = document.getElementById('mag-brand');

        const fsViewer = document.getElementById('fullscreen-viewer');
        const fsStage = document.getElementById('fullscreen-stage');
        const fsImg = document.getElementById('fs-image');
        const fsVideo = document.getElementById('fs-video');
        const fsCounter = document.getElementById('fs-counter');
        const fsCategory = document.getElementById('fs-category');
        const fsDate = document.getElementById('fs-date');
        const fsTitle = document.getElementById('fs-title');
        const fsCaption = document.getElementById('fs-caption');

        let activeFolderKey = sessionStorage.getItem(MAG_ACTIVE_FOLDER_KEY) || null;
        let fullscreenItemId = null;
        let scrollSaveTimer = null;

        function escapeHtml(str = '') {
            return String(str).replace(/[&<>"']/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));
        }

        function syncFolderStorage() {
            if (activeFolderKey) {
                sessionStorage.setItem(MAG_ACTIVE_FOLDER_KEY, activeFolderKey);
            } else {
                sessionStorage.removeItem(MAG_ACTIVE_FOLDER_KEY);
            }
        }

        function ensureBackAnchor() {
            try {
                history.pushState({ osdMagGuard: true }, '', window.location.href);
            } catch {}
        }

        function getFilteredPosts(q = '') {
            const data = getOSDData();
            const term = (q || '').trim().toLowerCase();
            if (!term) return data.posts || [];
            return (data.posts || []).filter(p =>
                (p.title || '').toLowerCase().includes(term) ||
                (p.description || '').toLowerCase().includes(term) ||
                (p.category || '').toLowerCase().includes(term) ||
                (p.date || '').toLowerCase().includes(term)
            );
        }

        function groupPostsByDate(posts) {
            const map = new Map();
            posts.forEach((post, index) => {
                const rawDate = (post.date || '').trim();
                const dateKey = rawDate || `undated-${index}`;
                const label = rawDate || 'Undated';
                if (!map.has(dateKey)) {
                    map.set(dateKey, {
                        key: dateKey,
                        dateLabel: label,
                        items: []
                    });
                }
                map.get(dateKey).items.push(post);
            });
            return Array.from(map.values());
        }

        function selectFolder(folderKey) {
            activeFolderKey = activeFolderKey === folderKey ? null : folderKey;
            fullscreenItemId = null;
            syncFolderStorage();
            syncFullscreenUI();
            renderMagazine(searchInput.value);
            if (activeFolderKey) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function openItemFullscreen(event, folderKey, itemId) {
            event.stopPropagation();
            if (activeFolderKey !== folderKey) {
                selectFolder(folderKey);
                return;
            }
            activeFolderKey = folderKey;
            fullscreenItemId = itemId;
            syncFolderStorage();
            syncFullscreenUI();
        }

        function exitFullscreenToFolder() {
            const folders = groupPostsByDate(getFilteredPosts(searchInput.value));
            let targetFolderKey = activeFolderKey;

            if (fullscreenItemId) {
                const ownerFolder = folders.find(f => f.items.some(item => item.id === fullscreenItemId));
                if (ownerFolder) targetFolderKey = ownerFolder.key;
            }

            fullscreenItemId = null;
            activeFolderKey = targetFolderKey;
            syncFolderStorage();
            syncFullscreenUI();
            renderMagazine(searchInput.value);
            if (activeFolderKey) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function getActiveFolderItems() {
            const folders = groupPostsByDate(getFilteredPosts(searchInput.value));
            if (!folders.length) return [];
            const currentFolder = folders.find(f => f.key === activeFolderKey)
                || folders.find(f => f.items.some(item => item.id === fullscreenItemId))
                || folders[0];
            return currentFolder ? currentFolder.items : [];
        }

        function stepFullscreenItem(delta) {
            const items = getActiveFolderItems();
            if (!items.length) return;
            const currentIdx = Math.max(0, items.findIndex(item => item.id === fullscreenItemId));
            const nextIdx = (currentIdx + delta + items.length) % items.length;
            const nextItem = items[nextIdx];
            if (!nextItem) return;

            fullscreenItemId = nextItem.id;
            syncFullscreenUI();
        }

        function syncFullscreenUI() {
            const items = getActiveFolderItems();
            if (!fullscreenItemId || !items.length) {
                fsViewer.classList.add('hidden');
                fsVideo.src = '';
                document.documentElement.style.overflow = '';
                return;
            }

            const idx = items.findIndex(item => item.id === fullscreenItemId);
            const item = idx >= 0 ? items[idx] : items[0];
            const safeIdx = idx >= 0 ? idx : 0;
            const media = parseDriveMedia(item.mediaUrl, item.mediaType);

            fsViewer.classList.remove('hidden');
            document.documentElement.style.overflow = 'hidden';

            fsCounter.textContent = `${safeIdx + 1} / ${items.length}`;
            fsCategory.textContent = item.category || 'JOURNAL';
            fsDate.textContent = item.date || '';
            fsTitle.textContent = item.title || '';
            fsCaption.textContent = item.description || '';

            if (item.mediaType === 'video') {
                fsImg.classList.add('hidden');
                fsVideo.classList.remove('hidden');
                fsVideo.src = media;
            } else {
                fsVideo.classList.add('hidden');
                fsVideo.src = '';
                fsImg.classList.remove('hidden');
                fsImg.src = media;
                fsImg.alt = item.title || '';
            }
        }

        window.addEventListener('popstate', () => {
            ensureBackAnchor();

            if (fullscreenItemId) {
                exitFullscreenToFolder();
                return;
            }

            if (activeFolderKey) {
                activeFolderKey = null;
                syncFolderStorage();
                renderMagazine(searchInput.value);
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            window.location.href = 'index.html';
        });

        let touchStartX = 0;
        let touchDeltaX = 0;

        fsStage.addEventListener('touchstart', (e) => {
            if (!e.touches || !e.touches.length) return;
            touchStartX = e.touches[0].clientX;
            touchDeltaX = 0;
            fsImg.style.transition = 'none';
        }, { passive: true });

        fsStage.addEventListener('touchmove', (e) => {
            if (!e.touches || !e.touches.length) return;
            touchDeltaX = e.touches[0].clientX - touchStartX;
            if (Math.abs(touchDeltaX) > 6 && !fsImg.classList.contains('hidden')) {
                fsImg.style.transform = `translateX(${touchDeltaX * 0.45}px) rotate(${touchDeltaX * 0.015}deg)`;
            }
        }, { passive: true });

        fsStage.addEventListener('touchend', () => {
            fsImg.style.transition = 'transform 0.22s ease-out';
            fsImg.style.transform = 'translateX(0px) rotate(0deg)';
            if (Math.abs(touchDeltaX) > 55) {
                stepFullscreenItem(touchDeltaX < 0 ? 1 : -1);
            }
            touchStartX = 0;
            touchDeltaX = 0;
        });

        document.getElementById('fs-close-btn').addEventListener('click', exitFullscreenToFolder);
        document.getElementById('fs-prev-btn').addEventListener('click', () => stepFullscreenItem(-1));
        document.getElementById('fs-next-btn').addEventListener('click', () => stepFullscreenItem(1));

        function renderThumbTile(item, folderKey, heightClass) {
            const media = parseDriveMedia(item.mediaUrl, item.mediaType);
            const safeTitle = escapeHtml(item.title);
            const safeMedia = escapeHtml(media);
            const safeFolder = escapeHtml(folderKey);
            const safeId = escapeHtml(item.id);

            if (item.mediaType === 'video') {
                return `
                    <div onclick="openItemFullscreen(event, '${safeFolder}', '${safeId}')" class="${heightClass} w-full bg-black flex flex-col items-center justify-center text-[10px] font-bold text-blue-400 cursor-zoom-in">
                        <span>▶ VIDEO</span>
                    </div>`;
            }
            return `
                <div onclick="openItemFullscreen(event, '${safeFolder}', '${safeId}')" class="${heightClass} w-full bg-black overflow-hidden cursor-zoom-in">
                    <img src="${safeMedia}" alt="${safeTitle}" loading="lazy" class="w-full h-full object-cover" />
                </div>`;
        }

        function getFolderCountsText(items) {
            const photos = items.filter(i => i.mediaType !== 'video').length;
            const videos = items.filter(i => i.mediaType === 'video').length;
            const parts = [];
            if (photos) parts.push(`${photos} photo${photos > 1 ? 's' : ''}`);
            if (videos) parts.push(`${videos} video${videos > 1 ? 's' : ''}`);
            return parts.join(' • ') || `${items.length} item${items.length > 1 ? 's' : ''}`;
        }

        function buildExpandedFolder(folder) {
            const safeFolderKey = escapeHtml(folder.key);
            const safeDate = escapeHtml(folder.dateLabel);
            const countsText = escapeHtml(getFolderCountsText(folder.items));
            const leadItem = folder.items[0];
            const summaryTitle = escapeHtml(leadItem ? leadItem.title : folder.dateLabel);

            const itemsHtml = folder.items.map(item => {
                const title = escapeHtml(item.title);
                const category = escapeHtml(item.category || 'JOURNAL');
                const desc = escapeHtml(item.description || '');
                const mediaType = escapeHtml(item.mediaType || 'image');

                return `
                    <div class="rounded-xl bg-[#121417]/80 border border-white/10 overflow-hidden">
                        ${renderThumbTile(item, folder.key, item.mediaType === 'video' ? 'h-40' : 'h-36')}
                        <div class="p-2.5">
                            <div class="flex items-center justify-between text-[10px] font-bold uppercase text-blue-400">
                                <span>${category}</span>
                                <span class="text-white/45 font-normal">${mediaType}</span>
                            </div>
                            <h4 class="text-xs font-bold text-white leading-snug mt-0.5">${title}</h4>
                            <p class="text-[11px] text-white/75 mt-1 leading-relaxed whitespace-pre-line">${desc}</p>
                        </div>
                    </div>`;
            }).join('');

            return `
                <article
                    onclick="selectFolder('${safeFolderKey}')"
                    class="lead-stage cursor-pointer rounded-2xl bg-[#1E2126]/95 backdrop-blur-xl border border-blue-400/50 shadow-2xl shadow-black/75 overflow-hidden p-3 space-y-2.5"
                >
                    <div class="flex items-center justify-between gap-2">
                        <div>
                            <div class="text-[10px] font-bold uppercase tracking-wider text-blue-400">${safeDate}</div>
                            <h2 class="text-base font-extrabold text-white leading-snug">${summaryTitle}</h2>
                        </div>
                        <span class="text-[10px] font-mono px-2 py-1 rounded-lg bg-blue-500/15 text-blue-300 shrink-0">${countsText}</span>
                    </div>
                    <div class="space-y-2 max-h-[58vh] overflow-y-auto pr-0.5">
                        ${itemsHtml}
                    </div>
                </article>`;
        }

        function buildThreeColFolder(folder) {
            const safeFolderKey = escapeHtml(folder.key);
            const safeDate = escapeHtml(folder.dateLabel);
            const firstItem = folder.items[0];
            const title = escapeHtml(firstItem ? firstItem.title : folder.dateLabel);
            const desc = escapeHtml(firstItem ? (firstItem.description || '') : '');
            const countBadge = `${folder.items.length}`;

            return `
                <article
                    onclick="selectFolder('${safeFolderKey}')"
                    class="mini-grid-card cursor-pointer rounded-xl bg-[#1E2126]/90 border border-white/10 hover:border-blue-400/40 overflow-hidden flex flex-col"
                >
                    ${firstItem ? renderThumbTile(firstItem, folder.key, 'h-16') : '<div class="h-16 bg-black"></div>'}
                    <div class="p-2 flex-1 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between text-[9px] font-bold text-blue-400 truncate">
                                <span class="truncate">${safeDate}</span>
                                <span class="font-mono text-white/60">${countBadge}</span>
                            </div>
                            <h3 class="text-[11px] font-bold text-white leading-tight line-clamp-1 mt-0.5">${title}</h3>
                            <p class="text-[10px] text-white/60 line-clamp-2 mt-0.5 leading-snug">${desc}</p>
                        </div>
                    </div>
                </article>`;
        }

        function buildFolderCard(folder) {
            const safeFolderKey = escapeHtml(folder.key);
            const safeDate = escapeHtml(folder.dateLabel);
            const countsText = escapeHtml(getFolderCountsText(folder.items));
            const firstItem = folder.items[0];
            const title = escapeHtml(firstItem ? firstItem.title : folder.dateLabel);
            const desc = escapeHtml(firstItem ? (firstItem.description || '') : '');
            const previewItems = folder.items.slice(0, 3);

            const stripHtml = previewItems.length > 1
                ? `<div class="grid grid-cols-3 gap-1.5 px-3 pt-3">${previewItems.map(item => renderThumbTile(item, folder.key, 'h-20')).join('')}</div>`
                : (firstItem ? `<div class="px-3 pt-3">${renderThumbTile(firstItem, folder.key, 'h-36')}</div>` : '');

            return `
                <article
                    onclick="selectFolder('${safeFolderKey}')"
                    class="compact-card cursor-pointer rounded-2xl bg-[#1E2126] border border-white/10 hover:border-blue-400/35 overflow-hidden"
                >
                    ${stripHtml}
                    <div class="p-3">
                        <div class="flex items-center justify-between text-[10px] font-bold uppercase text-blue-400">
                            <span>${safeDate}</span>
                            <span class="text-white/50 font-mono font-normal">${countsText}</span>
                        </div>
                        <h3 class="text-sm font-bold text-white leading-snug mt-0.5">${title}</h3>
                        <p class="text-xs mt-1 line-clamp-2 text-white/75 leading-relaxed">${desc}</p>
                    </div>
                </article>`;
        }

        function renderMagazine(q = '') {
            const data = getOSDData();
            logoEl.src = parseDriveMedia(data.brand.logoUrl, 'image');
            brandEl.textContent = data.brand.siteName;

            const posts = getFilteredPosts(q);
            const folders = groupPostsByDate(posts);

            if (!folders.length) {
                feedEl.innerHTML = `<div class="p-6 rounded-2xl bg-[#1E2126] text-center text-xs text-white/50">No matching posts found.</div>`;
                return;
            }

            const featuredFolder = activeFolderKey ? folders.find(f => f.key === activeFolderKey) : null;

            if (featuredFolder) {
                const others = folders.filter(f => f.key !== featuredFolder.key);
                const topThree = others.slice(0, 3);
                const remaining = others.slice(3);

                const topThreeHtml = topThree.length
                    ? `<div class="grid grid-cols-3 gap-2 pt-1">${topThree.map(f => buildThreeColFolder(f)).join('')}</div>`
                    : '';

                const remainingHtml = remaining.length
                    ? `<div class="space-y-2.5 pt-1">${remaining.map(f => buildFolderCard(f)).join('')}</div>`
                    : '';

                feedEl.innerHTML = `
                    ${buildExpandedFolder(featuredFolder)}
                    ${topThreeHtml}
                    ${remainingHtml}
                `;
                return;
            }

            feedEl.innerHTML = folders.map(folder => buildFolderCard(folder)).join('');
        }

        window.addEventListener('scroll', () => {
            clearTimeout(scrollSaveTimer);
            scrollSaveTimer = setTimeout(() => {
                sessionStorage.setItem(MAG_SCROLL_KEY, String(window.scrollY));
            }, 80);
        }, { passive: true });

        searchInput.addEventListener('input', e => renderMagazine(e.target.value));
        document.getElementById('nav-mag-refresh').addEventListener('click', () => {
            renderMagazine(searchInput.value);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        window.addEventListener('DOMContentLoaded', () => {
            try {
                history.replaceState({ osdMagBase: true }, '', window.location.href);
                history.pushState({ osdMagGuard: true }, '', window.location.href);
            } catch {}
            renderMagazine();
            const savedScroll = Number(sessionStorage.getItem(MAG_SCROLL_KEY) || '0');
            if (savedScroll > 0) {
                requestAnimationFrame(() => window.scrollTo(0, savedScroll));
            }
            enforceRoleLock('magazine', 'E-Magazine');
        });

        window.addEventListener('storage', () => renderMagazine(searchInput.value));
        window.addEventListener('osd_data_updated', () => renderMagazine(searchInput.value));
    </script>
</body>
</html>
