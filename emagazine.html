<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>E-Magazine — Off Script Diaries</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121417] text-white font-sans antialiased pb-24">

    <header class="sticky top-0 z-40 bg-[#121417]/90 backdrop-blur-md border-b border-white/10">
        <div class="max-w-md mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2.5 min-w-0">
                <img id="mag-logo" src="" class="w-9 h-9 rounded-full object-cover aspect-square border border-blue-400/50 shrink-0" />
                <span id="mag-brand" class="text-sm font-bold truncate">Off Script Diaries</span>
            </a>
            <a href="emagazineadmin.html" class="px-3 py-1.5 rounded-full bg-blue-600 text-xs font-semibold shrink-0">+ New Post</a>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 pt-4 space-y-4">
        <input id="search-posts" type="search" placeholder="Search title, date, category..." class="w-full h-11 px-4 rounded-xl bg-[#1E2126] border border-white/10 text-sm text-white focus:outline-none focus:border-blue-500" />
        <div id="magazine-feed" class="space-y-5"></div>
    </main>

    <nav class="fixed bottom-0 inset-x-0 z-40 bg-[#1E2126]/95 backdrop-blur-md border-t border-white/10">
        <div class="max-w-md mx-auto h-16 grid grid-cols-4 items-center text-center text-[11px] font-medium">
            <a href="index.html" class="text-white/65 flex flex-col items-center gap-0.5"><span>⌂</span><span>Home</span></a>
            <a href="emagazine.html" class="text-blue-400 flex flex-col items-center gap-0.5"><span>📖</span><span>Magazine</span></a>
            <a href="emagazineadmin.html" class="text-white/65 flex flex-col items-center gap-0.5"><span>＋</span><span>Post</span></a>
            <a href="admin.html" class="text-white/65 flex flex-col items-center gap-0.5"><span>⚙</span><span>Admin</span></a>
        </div>
    </nav>

    <script src="js/store.js"></script>
    <script>
        enforcePageLock("E-Magazine");

        function renderMagazine(q = '') {
            const data = getOSDData();
            document.getElementById('mag-logo').src = parseDriveMedia(data.brand.logoUrl, 'image');
            document.getElementById('mag-brand').textContent = data.brand.siteName;

            const term = q.toLowerCase();
            const posts = data.posts.filter(p =>
                p.title.toLowerCase().includes(term) ||
                p.description.toLowerCase().includes(term) ||
                (p.category || '').toLowerCase().includes(term) ||
                (p.date || '').includes(term)
            );

            const feed = document.getElementById('magazine-feed');
            if (!posts.length) {
                feed.innerHTML = `<div class="p-8 rounded-2xl bg-[#1E2126] text-center text-xs text-white/50">No matching posts found.</div>`;
                return;
            }

            feed.innerHTML = posts.map(post => {
                const media = parseDriveMedia(post.mediaUrl, post.mediaType);
                const mediaBlock = post.mediaType === 'video'
                    ? `<div class="aspect-video w-full bg-black"><iframe src="${media}" class="w-full h-full border-0" allow="autoplay; fullscreen" allowfullscreen></iframe></div>`
                    : `<div class="aspect-[4/3] w-full bg-black"><img src="${media}" alt="${post.title}" class="w-full h-full object-cover" /></div>`;

                return `
                <article class="rounded-2xl bg-[#1E2126] border border-white/10 overflow-hidden">
                    ${mediaBlock}
                    <div class="p-4">
                        <div class="flex items-center justify-between text-[11px] font-bold uppercase text-blue-400">
                            <span>${post.category || 'JOURNAL'}</span>
                            <span class="text-white/50 font-normal">${post.date}</span>
                        </div>
                        <h2 class="text-lg font-bold text-white mt-1">${post.title}</h2>
                        <p class="text-xs text-white/75 mt-2 leading-relaxed whitespace-pre-line">${post.description}</p>
                    </div>
                </article>`;
            }).join('');
        }

        document.getElementById('search-posts').addEventListener('input', e => renderMagazine(e.target.value));
        window.addEventListener('DOMContentLoaded', () => renderMagazine());
        window.addEventListener('storage', () => renderMagazine());
    </script>
</body>
</html>
