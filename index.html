<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Off Script Diaries</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        appbg: '#121417',
                        appcard: '#1E2126',
                        appcard2: '#252930',
                        accent: '#3B82F6'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #121417; color: #F8FAFC; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="font-sans antialiased pb-24">

    <!-- MOBILE TOP BAR -->
    <header class="sticky top-0 z-40 bg-[#121417]/90 backdrop-blur-md border-b border-white/10">
        <div class="max-w-md mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3 min-w-0">
                <img id="nav-logo" src="" alt="Logo" class="w-10 h-10 rounded-full object-cover aspect-square border border-blue-400/50 bg-[#1E2126] shrink-0" />
                <div class="truncate">
                    <h1 id="nav-site-name" class="text-base font-bold text-white truncate leading-tight">Off Script Diaries</h1>
                    <p id="nav-couple-names" class="text-[11px] text-blue-400 truncate">Aarav & Meera</p>
                </div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <a href="admin.html" class="px-3 py-1.5 rounded-full bg-[#1E2126] border border-white/10 text-xs font-medium text-white/80 active:scale-95">Admin</a>
                <button onclick="lockSession()" title="Lock" class="p-2 rounded-full bg-[#1E2126] border border-white/10 text-xs text-white/70 active:scale-95">🔒</button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 pt-4 space-y-6">

        <!-- 1. HERO BANNER CARD -->
        <section class="relative rounded-3xl overflow-hidden bg-[#1E2126] border border-white/10 min-h-[270px] flex items-end">
            <img id="hero-bg" src="" alt="Cover" class="absolute inset-0 w-full h-full object-cover opacity-40" />
            <div class="absolute inset-0 bg-gradient-to-t from-[#121417] via-[#121417]/50 to-transparent"></div>
            <div class="relative z-10 p-5 w-full">
                <span id="hero-eyebrow" class="inline-block text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full bg-blue-600/30 text-blue-300 border border-blue-400/30 mb-2"></span>
                <h2 id="hero-headline" class="text-2xl font-extrabold text-white leading-snug"></h2>
                <p id="hero-subheadline" class="text-xs text-white/75 mt-1.5 line-clamp-2"></p>
                <div class="mt-4 flex items-center justify-between gap-2">
                    <a id="hero-cta" href="emagazine.html" class="px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold active:scale-95 transition"></a>
                    <span id="hero-location" class="text-[11px] text-white/55 truncate"></span>
                </div>
            </div>
        </section>

        <!-- 2. ORIGIN STORY (HORIZONTAL MEDIA + STORY CARD) -->
        <section id="sec-origin" class="rounded-2xl bg-[#1E2126] border border-white/10 p-4">
            <div class="flex items-center justify-between mb-3">
                <span class="text-[11px] font-bold uppercase tracking-wider text-blue-400">02 • Origin</span>
                <span id="origin-date" class="text-[11px] text-white/50"></span>
            </div>
            <div class="flex gap-3.5 items-center">
                <img id="origin-img" src="" alt="Origin" class="w-24 h-28 rounded-2xl object-cover shrink-0 bg-[#121417]" />
                <div class="min-w-0">
                    <h3 id="origin-title" class="text-base font-bold text-white"></h3>
                    <p id="origin-story" class="text-xs text-white/70 mt-1 line-clamp-3 leading-relaxed"></p>
                </div>
            </div>
            <p id="origin-quote" class="mt-3 pt-3 border-t border-white/10 text-xs italic text-blue-300"></p>
        </section>

        <!-- 3. TELEMETRY (2x2 METRIC TILES) -->
        <section class="grid grid-cols-2 gap-3">
            <div class="p-4 rounded-2xl bg-[#1E2126] border border-white/10">
                <span class="text-[11px] text-white/50">Days Together</span>
                <div id="stat-days" class="text-2xl font-extrabold text-blue-400 mt-1">0</div>
            </div>
            <div class="p-4 rounded-2xl bg-[#1E2126] border border-white/10">
                <span class="text-[11px] text-white/50">Cities</span>
                <div id="stat-cities" class="text-2xl font-extrabold text-white mt-1">0</div>
            </div>
            <div class="p-4 rounded-2xl bg-[#1E2126] border border-white/10">
                <span class="text-[11px] text-white/50">Coffees</span>
                <div id="stat-coffee" class="text-2xl font-extrabold text-white mt-1">0</div>
            </div>
            <div class="p-4 rounded-2xl bg-[#1E2126] border border-white/10">
                <span class="text-[11px] text-white/50">Late Calls</span>
                <div id="stat-calls" class="text-2xl font-extrabold text-emerald-400 mt-1">0</div>
            </div>
        </section>

        <!-- 4. E-MAGAZINE SPOTLIGHT (SNAP SCROLL RAIL) -->
        <section id="sec-magazine">
            <div class="flex items-end justify-between mb-3">
                <div>
                    <span class="text-[11px] font-bold uppercase tracking-wider text-blue-400">04 • E-Magazine</span>
                    <h3 id="mag-heading" class="text-lg font-bold text-white"></h3>
                </div>
                <a href="emagazine.html" class="text-xs font-semibold text-blue-400">See all →</a>
            </div>
            <p id="mag-desc" class="text-xs text-white/60 mb-3"></p>
            <div id="home-magazine-rail" class="flex gap-3.5 overflow-x-auto no-scrollbar snap-x snap-mandatory pb-1"></div>
        </section>

        <!-- 5. BUCKET LIST (COMPACT CHECKLIST PILLS) -->
        <section class="rounded-2xl bg-[#1E2126] border border-white/10 p-4">
            <span class="text-[11px] font-bold uppercase tracking-wider text-blue-400">05 • Bucket List</span>
            <h3 class="text-base font-bold text-white mt-0.5 mb-3">Plans Ahead</h3>
            <div id="bucket-list-container" class="space-y-2"></div>
        </section>

        <!-- 6. DUAL PERSPECTIVES (SPLIT TAB / DUAL ROW) -->
        <section class="space-y-2.5">
            <span class="text-[11px] font-bold uppercase tracking-wider text-blue-400 px-1">06 • Perspectives</span>
            <div class="p-4 rounded-2xl bg-[#1E2126] border-l-4 border-l-blue-500 border border-white/10">
                <span id="pov-one-name" class="text-[11px] font-bold uppercase text-blue-400"></span>
                <p id="pov-one-note" class="text-sm text-white/90 mt-1 leading-relaxed"></p>
            </div>
            <div class="p-4 rounded-2xl bg-[#1E2126] border-l-4 border-l-emerald-500 border border-white/10">
                <span id="pov-two-name" class="text-[11px] font-bold uppercase text-emerald-400"></span>
                <p id="pov-two-note" class="text-sm text-white/90 mt-1 leading-relaxed"></p>
            </div>
        </section>

        <!-- 7. MILESTONES (VERTICAL STEPPER) -->
        <section class="rounded-2xl bg-[#1E2126] border border-white/10 p-4">
            <span class="text-[11px] font-bold uppercase tracking-wider text-blue-400">07 • Timeline</span>
            <h3 class="text-base font-bold text-white mt-0.5 mb-4">Key Moments</h3>
            <div id="timeline-container" class="space-y-4 border-l border-blue-500/40 ml-2 pl-4"></div>
        </section>

        <!-- 8. SOUNDTRACK (COMPACT PLAYER LIST) -->
        <section class="rounded-2xl bg-[#1E2126] border border-white/10 p-4">
            <div class="flex items-center justify-between mb-3">
                <div>
                    <span class="text-[11px] font-bold uppercase tracking-wider text-blue-400">08 • Soundtrack</span>
                    <h3 id="soundtrack-title" class="text-base font-bold text-white"></h3>
                </div>
                <span class="w-9 h-9 rounded-full bg-blue-600/20 text-blue-400 flex items-center justify-center text-sm font-bold">♪</span>
            </div>
            <p id="soundtrack-note" class="text-xs text-white/55 mb-3"></p>
            <div id="soundtrack-list" class="divide-y divide-white/10"></div>
        </section>

        <!-- 9. LOVE NOTES (CAROUSEL CARDS) -->
        <section>
            <span class="text-[11px] font-bold uppercase tracking-wider text-blue-400 px-1">09 • Notes</span>
            <div id="lovenotes-container" class="flex gap-3 overflow-x-auto no-scrollbar snap-x snap-mandatory mt-2 pb-1"></div>
        </section>

        <!-- 10. NEXT STOP FOOTER CAPSULE -->
        <footer class="rounded-3xl bg-gradient-to-br from-[#1E2126] to-[#252930] border border-white/10 p-5 text-center space-y-2">
            <img id="footer-logo" src="" alt="Emblem" class="w-14 h-14 rounded-full object-cover aspect-square mx-auto border border-blue-400/50 bg-[#121417]" />
            <span class="text-[10px] font-bold uppercase tracking-widest text-blue-400 block">10 • Next Up</span>
            <h3 id="capsule-heading" class="text-xl font-extrabold text-white"></h3>
            <p id="capsule-message" class="text-xs text-white/70"></p>
            <div class="pt-1">
                <span class="inline-block px-3 py-1 rounded-full bg-blue-600/20 text-blue-300 text-xs font-semibold">
                    Destination: <span id="capsule-destination"></span>
                </span>
            </div>
            <p class="text-[11px] text-white/40 pt-3">© <span id="footer-year"></span> <span id="footer-brand"></span></p>
        </footer>

    </main>

    <!-- FIXED MOBILE BOTTOM NAVIGATION -->
    <nav class="fixed bottom-0 inset-x-0 z-40 bg-[#1E2126]/95 backdrop-blur-md border-t border-white/10">
        <div class="max-w-md mx-auto h-16 grid grid-cols-4 items-center text-center text-[11px] font-medium">
            <a href="index.html" class="text-blue-400 flex flex-col items-center gap-0.5">
                <span>⌂</span><span>Home</span>
            </a>
            <a href="emagazine.html" class="text-white/65 hover:text-white flex flex-col items-center gap-0.5">
                <span>📖</span><span>Magazine</span>
            </a>
            <a href="emagazineadmin.html" class="text-white/65 hover:text-white flex flex-col items-center gap-0.5">
                <span>＋</span><span>Post</span>
            </a>
            <a href="admin.html" class="text-white/65 hover:text-white flex flex-col items-center gap-0.5">
                <span>⚙</span><span>Admin</span>
            </a>
        </div>
    </nav>

    <script src="js/store.js"></script>
    <script>
        enforcePageLock("Off Script Diaries");

        function renderHomePage() {
            const data = getOSDData();
            const logoSrc = parseDriveMedia(data.brand.logoUrl, 'image');

            document.title = data.brand.siteName;
            document.getElementById('nav-logo').src = logoSrc;
            document.getElementById('footer-logo').src = logoSrc;
            document.getElementById('nav-site-name').textContent = data.brand.siteName;
            document.getElementById('nav-couple-names').textContent = data.brand.coupleNames;
            document.getElementById('footer-brand').textContent = data.brand.siteName;
            document.getElementById('footer-year').textContent = data.brand.establishedYear;

            // 1. Hero
            document.getElementById('hero-bg').src = parseDriveMedia(data.sections.hero.bgImage, 'image');
            document.getElementById('hero-eyebrow').textContent = data.sections.hero.eyebrow;
            document.getElementById('hero-headline').textContent = data.sections.hero.headline;
            document.getElementById('hero-subheadline').textContent = data.sections.hero.subheadline;
            document.getElementById('hero-cta').textContent = data.sections.hero.ctaText;
            document.getElementById('hero-location').textContent = data.brand.location;

            // 2. Origin
            document.getElementById('origin-img').src = parseDriveMedia(data.sections.origin.image, 'image');
            document.getElementById('origin-date').textContent = data.sections.origin.date;
            document.getElementById('origin-title').textContent = data.sections.origin.title;
            document.getElementById('origin-story').textContent = data.sections.origin.story;
            document.getElementById('origin-quote').textContent = data.sections.origin.quote;

            // 3. Telemetry
            const start = new Date(data.sections.telemetry.startDate);
            const days = Math.max(1, Math.floor((new Date() - start) / 86400000));
            document.getElementById('stat-days').textContent = isNaN(days) ? '365+' : days.toLocaleString();
            document.getElementById('stat-cities').textContent = data.sections.telemetry.citiesExplored;
            document.getElementById('stat-coffee').textContent = data.sections.telemetry.coffeeCups;
            document.getElementById('stat-calls').textContent = data.sections.telemetry.midnightCalls;

            // 4. Magazine Rail
            document.getElementById('mag-heading').textContent = data.sections.magazineSpotlight.heading;
            document.getElementById('mag-desc').textContent = data.sections.magazineSpotlight.description;
            document.getElementById('home-magazine-rail').innerHTML = data.posts.map(post => {
                const media = parseDriveMedia(post.mediaUrl, post.mediaType);
                const visual = post.mediaType === 'video'
                    ? `<iframe src="${media}" class="w-full h-full border-0" allow="autoplay; fullscreen"></iframe>`
                    : `<img src="${media}" alt="${post.title}" class="w-full h-full object-cover" />`;
                return `
                <a href="emagazine.html" class="snap-start shrink-0 w-64 rounded-2xl bg-[#1E2126] border border-white/10 overflow-hidden block">
                    <div class="h-36 bg-black relative">${visual}</div>
                    <div class="p-3.5">
                        <div class="flex justify-between text-[10px] font-bold uppercase text-blue-400">
                            <span>${post.category || 'DIARY'}</span>
                            <span class="text-white/45">${post.date}</span>
                        </div>
                        <h4 class="text-sm font-bold text-white mt-1 truncate">${post.title}</h4>
                        <p class="text-xs text-white/65 mt-1 line-clamp-2">${post.description}</p>
                    </div>
                </a>`;
            }).join('');

            // 5. Bucket List
            document.getElementById('bucket-list-container').innerHTML = data.sections.bucketList.map(item => `
                <div class="flex items-center gap-3 p-2.5 rounded-xl bg-[#121417]/70 border border-white/5 text-xs">
                    <span class="w-5 h-5 rounded-full flex items-center justify-center shrink-0 ${item.completed ? 'bg-blue-600 text-white font-bold' : 'border border-white/25 text-transparent'}">✓</span>
                    <span class="${item.completed ? 'line-through text-white/45' : 'text-white/90'}">${item.task}</span>
                </div>
            `).join('');

            // 6. Perspectives
            document.getElementById('pov-one-name').textContent = data.sections.perspectives.partnerOneName;
            document.getElementById('pov-one-note').textContent = data.sections.perspectives.partnerOneNote;
            document.getElementById('pov-two-name').textContent = data.sections.perspectives.partnerTwoName;
            document.getElementById('pov-two-note').textContent = data.sections.perspectives.partnerTwoNote;

            // 7. Timeline
            document.getElementById('timeline-container').innerHTML = data.sections.milestones.map(m => `
                <div class="relative">
                    <span class="text-[10px] font-bold uppercase tracking-wider text-blue-400">${m.date}</span>
                    <h4 class="text-sm font-bold text-white">${m.title}</h4>
                    <p class="text-xs text-white/65 mt-0.5">${m.desc}</p>
                </div>
            `).join('');

            // 8. Soundtrack
            document.getElementById('soundtrack-title').textContent = data.sections.soundtrack.albumTitle;
            document.getElementById('soundtrack-note').textContent = data.sections.soundtrack.curatorNote;
            document.getElementById('soundtrack-list').innerHTML = data.sections.soundtrack.tracks.map((t, i) => `
                <div class="py-2.5 flex items-center justify-between text-xs">
                    <div class="truncate pr-2">
                        <span class="text-white/40 mr-2">0${i + 1}</span>
                        <span class="font-semibold text-white">${t.title}</span>
                        <span class="text-white/50 ml-1">• ${t.artist}</span>
                    </div>
                    <span class="text-blue-400 font-mono shrink-0">${t.duration}</span>
                </div>
            `).join('');

            // 9. Love Notes
            document.getElementById('lovenotes-container').innerHTML = data.sections.loveNotes.map(n => `
                <div class="snap-start shrink-0 w-60 p-4 rounded-2xl bg-[#1E2126] border border-white/10">
                    <span class="text-[10px] font-bold uppercase tracking-wider text-blue-400">${n.tag}</span>
                    <p class="text-xs text-white/90 mt-2 leading-relaxed">"${n.message}"</p>
                </div>
            `).join('');

            // 10. Capsule
            document.getElementById('capsule-heading').textContent = data.sections.capsule.heading;
            document.getElementById('capsule-message').textContent = data.sections.capsule.message;
            document.getElementById('capsule-destination').textContent = data.sections.capsule.nextDestination;
        }

        window.addEventListener('DOMContentLoaded', renderHomePage);
        window.addEventListener('storage', renderHomePage);
        window.addEventListener('osd_data_updated', renderHomePage);
    </script>
</body>
</html>
